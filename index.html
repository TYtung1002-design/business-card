<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ========== 顏色設定（淺色模式） ========== */
:root {
  --bg-grad: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 45%, #cffafe 100%);
  --blob1: #60a5fa;
  --blob2: #22d3ee;
  --blob3: #818cf8;
  --glass: rgba(255, 255, 255, 0.45);
  --glass-strong: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(255, 255, 255, 0.75);
  --shadow: 0 8px 32px rgba(30, 64, 175, 0.12);
  --text: #0f2744;
  --muted: #4a6584;
  --accent: #2563eb;
  --accent2: #0891b2;
  --chip-bg: rgba(37, 99, 235, 0.10);
  --chip-text: #1e40af;
  --warn: #b45309;
  color-scheme: light;
}
/* ========== 深色模式（跟隨系統設定） ========== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-grad: linear-gradient(135deg, #0b1528 0%, #0f2342 50%, #082f49 100%);
    --blob1: #1d4ed8;
    --blob2: #0e7490;
    --blob3: #4338ca;
    --glass: rgba(15, 30, 60, 0.45);
    --glass-strong: rgba(15, 30, 60, 0.7);
    --glass-border: rgba(148, 197, 255, 0.18);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --text: #e6f0ff;
    --muted: #9db4d3;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --chip-bg: rgba(96, 165, 250, 0.15);
    --chip-text: #bfdbfe;
    --warn: #fbbf24;
    color-scheme: dark;
  }
}
/* ========== 深色模式（手動切換） ========== */
:root[data-theme="dark"] {
  --bg-grad: linear-gradient(135deg, #0b1528 0%, #0f2342 50%, #082f49 100%);
  --blob1: #1d4ed8;
  --blob2: #0e7490;
  --blob3: #4338ca;
  --glass: rgba(15, 30, 60, 0.45);
  --glass-strong: rgba(15, 30, 60, 0.7);
  --glass-border: rgba(148, 197, 255, 0.18);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  --text: #e6f0ff;
  --muted: #9db4d3;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --chip-bg: rgba(96, 165, 250, 0.15);
  --chip-text: #bfdbfe;
  --warn: #fbbf24;
  color-scheme: dark;
}

/* ========== 基本設定 ========== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei",
    "Hiragino Sans", "Yu Gothic", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* ========== 背景的模糊光暈 ========== */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(70px); opacity: 0.55;
}
.b1 { width: 340px; height: 340px; background: var(--blob1); top: -80px; left: -60px; }
.b2 { width: 300px; height: 300px; background: var(--blob2); bottom: -60px; right: -40px; }
.b3 { width: 260px; height: 260px; background: var(--blob3); top: 40%; left: 55%; }
@media (prefers-reduced-motion: no-preference) {
  .blob { animation: float 18s ease-in-out infinite alternate; }
  .b2 { animation-duration: 22s; }
  .b3 { animation-duration: 26s; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(40px, 30px) scale(1.12); }
  }
}

/* ========== 毛玻璃卡片 ========== */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 24px;
}

/* ========== 版面 ========== */
.topbar, .wrap { max-width: 560px; margin: 0 auto; }
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 16px 0; gap: 12px;
}
.wrap { padding: 16px 16px 48px; display: grid; gap: 16px; }

/* 語言選單 */
.lang-wrap {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  color: var(--muted);
}
.lang-wrap select {
  appearance: none; -webkit-appearance: none;
  border: none; background: transparent; color: var(--text);
  font: inherit; font-weight: 500; cursor: pointer; padding-right: 4px;
}
.lang-wrap select option { color: #0f2744; background: #ffffff; }

.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  color: var(--text);
}
.icon { width: 20px; height: 20px; flex-shrink: 0; }

/* ========== 主卡片 ========== */
.hero { text-align: center; padding-top: 32px; }
.avatar {
  width: 108px; height: 108px; margin: 0 auto 16px;
  border-radius: 50%; padding: 4px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}
.avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--glass-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 600; color: var(--accent);
  overflow: hidden;
}
.avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
.name-secondary { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
.role { margin: 14px 0 0; color: var(--text); font-size: 15px; }
.role span { display: block; }
.role .org { color: var(--muted); font-size: 14px; }

/* 按鈕 */
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px; border-radius: 999px; border: none;
  font-weight: 500; font-size: 15px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
}
.btn.ghost {
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  color: var(--text);
}

/* ========== 區塊標題 ========== */
h2 {
  font-size: 14px; font-weight: 600; margin: 0 0 14px;
  color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase;
}
.bio { margin: 0; color: var(--text); }

/* ========== 聯絡方式 ========== */
.contact-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.contact-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px; border-radius: 16px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
}
.contact-icon {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--chip-bg); color: var(--accent);
}
.contact-text { flex: 1; min-width: 0; }
.contact-label { display: block; font-size: 12px; color: var(--muted); }
.contact-value { display: block; font-weight: 500; word-break: break-all; }
a.contact-value:hover { color: var(--accent); }
.copy-btn {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  border: none; background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.copy-btn:hover { background: var(--chip-bg); color: var(--accent); }
.copy-btn .icon { width: 18px; height: 18px; }

/* ========== 專長標籤 ========== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  background: var(--chip-bg); color: var(--chip-text);
  border: 1px solid var(--glass-border);
}

/* ========== QR code ========== */
.qr-sec { text-align: center; }
.seg {
  display: inline-flex; padding: 4px; border-radius: 999px; gap: 4px;
  background: var(--glass-strong); border: 1px solid var(--glass-border);
  max-width: 100%;
}
.seg-btn {
  border: none; background: transparent; padding: 8px 14px; border-radius: 999px;
  font-size: 14px; color: var(--muted); font-weight: 500;
}
.seg-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #ffffff; }
.qr-box {
  background: #ffffff; padding: 12px; border-radius: 18px;
  width: fit-content; margin: 18px auto 10px;
  box-shadow: 0 6px 24px rgba(30, 64, 175, 0.15);
}
.qr-box canvas { display: block; width: 220px; height: 220px; }
.qr-fallback { width: 220px; padding: 40px 12px; color: #4a6584; font-size: 14px; }
.hint { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.warn { margin: 8px 0 0; font-size: 13px; color: var(--warn); }

footer { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0 0; }

/* ========== 提示訊息 ========== */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: rgba(15, 39, 68, 0.88); color: #ffffff;
  padding: 10px 20px; border-radius: 999px; font-size: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .glass { padding: 20px; border-radius: 20px; }
  h1 { font-size: 24px; }
  .seg-btn { padding: 8px 10px; font-size: 13px; }
}

/* ========== 列印版面（名片正反面，9 x 5.4 公分） ========== */
.print-sheet { display: none; }
@page { size: A4; margin: 15mm; }
@media print {
  body { background: #ffffff !important; }
  .bg, .topbar, .wrap, .toast { display: none !important; }
  .print-sheet { display: flex !important; flex-direction: column; align-items: center; gap: 10mm; }
}
.pcard {
  width: 90mm; height: 54mm; position: relative; overflow: hidden;
  border: 0.3mm dashed #94a3b8; border-radius: 3mm;
  background: #ffffff; color: #0f2744;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
  font-family: "Inter", system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Hiragino Sans", "Malgun Gothic", sans-serif;
}
.pcard-front { padding: 6mm 6mm 5mm 9mm; display: flex; flex-direction: column; }
.pcard-front .bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 3mm;
  background: linear-gradient(180deg, #2563eb, #06b6d4);
}
.pcard-front .p-name { font-size: 15pt; font-weight: 600; line-height: 1.2; }
.pcard-front .p-name2 { font-size: 8.5pt; color: #4a6584; }
.pcard-front .p-role { font-size: 8pt; margin-top: 2mm; line-height: 1.4; }
.pcard-front .p-role .org { color: #4a6584; }
.pcard-front .p-contacts { margin-top: auto; font-size: 7.5pt; line-height: 1.5; color: #0f2744; }
.pcard-back {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm;
  background: linear-gradient(135deg, #e0f2fe, #dbeafe 50%, #cffafe);
}
.pcard-back img { width: 30mm; height: 30mm; background: #ffffff; padding: 1.5mm; border-radius: 2mm; }
.pcard-back .p-scan { font-size: 8pt; color: #1e40af; font-weight: 500; }
.pcard-back .p-name { font-size: 9pt; font-weight: 600; }
</style>
</head>

/* ---------- 小工具 ---------- */
const $ = (id) => document.getElementById(id);

// 安全地讀寫瀏覽器儲存空間（某些情況下會被瀏覽器封鎖，所以用 try/catch 包起來）
function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}

// 依照語言取出對應的文字；沒有該語言就用英文，再沒有就用繁中
function pick(field, lang) {
  if (field == null) return "";
  if (typeof field === "string" || Array.isArray(field)) return field;
  return field[lang] || field.en || field["zh-TW"] || "";
}

// 建立 HTML 元素（用 textContent 放文字，避免特殊符號出問題）
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 目前狀態 ---------- */
let lang = detectLang();
let qrMode = store("card-qr-mode") === "vcard" ? "vcard" : "url";

// 決定一開始要顯示的語言：網址參數 ?lang= → 上次選擇 → 瀏覽器語言 → 繁中
function detectLang() {
  const codes = LANGS.map((l) => l.code);
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && codes.includes(fromUrl)) return fromUrl;
  const saved = store("card-lang");
  if (saved && codes.includes(saved)) return saved;
  const prefs = navigator.languages || [navigator.language || ""];
  for (const p of prefs) {
    const lower = String(p).toLowerCase();
    if (lower.startsWith("zh")) {
      return /cn|hans|sg/.test(lower) ? "zh-CN" : "zh-TW";
    }
    const short = lower.slice(0, 2);
    if (codes.includes(short)) return short;
  }
  return "zh-TW";
}

/* ---------- 姓名相關 ---------- */
function primaryName() { return pick(PROFILE.name, lang); }
function secondaryName() {
  const primary = primaryName();
  const other = primary === PROFILE.name.en ? PROFILE.name["zh-TW"] : PROFILE.name.en;
  return other && other !== primary ? other : "";
}
function initials() {
  const en = PROFILE.name.en || "";
  const parts = en.split(/\s+/).filter(Boolean);
  if (parts.length === 0) return (PROFILE.name["zh-TW"] || "?").slice(0, 1);
  return parts.map((w) => w[0]).join("").slice(0, 2).toUpperCase();
}

/* ---------- 網址處理 ---------- */
function fullUrl(value, prefix) {
  if (!value) return "";
  return /^https?:\/\//i.test(value) ? value : prefix + value.replace(/^\/+/, "");
}
function prettyUrl(url) { return url.replace(/^https?:\/\//i, "").replace(/\/$/, ""); }

// 整理出要顯示的聯絡方式（空白的自動略過）
function contactItems() {
  const items = [];
  if (PROFILE.email) items.push({ key: "email", value: PROFILE.email, href: "mailto:" + PROFILE.email });
  if (PROFILE.phone) items.push({ key: "phone", value: PROFILE.phone, href: "tel:" + PROFILE.phone.replace(/[^\d+]/g, "") });
  if (PROFILE.website) {
    const u = fullUrl(PROFILE.website, "https://");
    items.push({ key: "website", value: prettyUrl(u), href: u, copyValue: u });
  }
  if (PROFILE.github) {
    const u = fullUrl(PROFILE.github, "https://github.com/");
    items.push({ key: "github", value: prettyUrl(u), href: u, copyValue: u });
  }
  if (PROFILE.linkedin) {
    const u = fullUrl(PROFILE.linkedin, "https://www.linkedin.com/in/");
    items.push({ key: "linkedin", value: prettyUrl(u), href: u, copyValue: u });
  }
  const addr = pick(PROFILE.address, lang);
  if (addr) items.push({ key: "address", value: addr });
  return items;
}

/* ---------- 產生 VCF（電子聯絡人檔案） ---------- */
function vEsc(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
}
// compact = true 時是給 QR code 用的精簡版（資料太多 QR code 會太密、不好掃）
function buildVCard(compact) {
  const np = PROFILE.nameParts || {};
  const cjk = /^(zh|ja)/.test(lang);
  const family = (cjk && np.familyZh) ? np.familyZh : (np.family || "");
  const given = (cjk && np.givenZh) ? np.givenZh : (np.given || "");
  const lines = ["BEGIN:VCARD", "VERSION:3.0"];
  lines.push("N:" + vEsc(family) + ";" + vEsc(given) + ";;;");
  lines.push("FN:" + vEsc(primaryName()));
  const org = pick(PROFILE.org, lang);
  const dept = pick(PROFILE.dept, lang);
  if (org) lines.push("ORG:" + vEsc(org) + (dept ? ";" + vEsc(dept) : ""));
  const title = pick(PROFILE.title, lang);
  if (title) lines.push("TITLE:" + vEsc(title));
  if (PROFILE.email) lines.push("EMAIL;TYPE=INTERNET:" + PROFILE.email);
  if (PROFILE.phone) lines.push("TEL;TYPE=CELL:" + PROFILE.phone);
  if (PROFILE.website) lines.push("URL:" + fullUrl(PROFILE.website, "https://"));
  if (PROFILE.github) lines.push("URL:" + fullUrl(PROFILE.github, "https://github.com/"));
  if (PROFILE.linkedin) lines.push("URL:" + fullUrl(PROFILE.linkedin, "https://www.linkedin.com/in/"));
  const addr = pick(PROFILE.address, lang);
  if (addr) lines.push("ADR;TYPE=WORK:;;" + vEsc(addr) + ";;;;");
  const second = secondaryName();
  if (!compact) {
    const noteParts = [];
    if (second) noteParts.push(second);
    const bio = pick(PROFILE.bio, lang);
    if (bio) noteParts.push(bio);
    if (noteParts.length) lines.push("NOTE:" + vEsc(noteParts.join("\n")));
    if (/^https?:\/\//i.test(PROFILE.photo)) lines.push("PHOTO;VALUE=URI:" + PROFILE.photo);
  } else if (second) {
    lines.push("NOTE:" + vEsc(second));
  }
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

function downloadVCard() {
  const blob = new Blob([buildVCard(false)], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (PROFILE.name.en || "contact").replace(/\s+/g, "_") + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(I18N[lang].vcfDone);
}

/* ---------- 複製文字 ---------- */
function copyText(text) {
  const t = I18N[lang];
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    showToast(ok ? t.copied : t.copyFail);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(t.copied), fallback);
  } else {
    fallback();
  }
}

/* ---------- QR code ---------- */
// QR code 要放的內容：名片網址，或聯絡人資料
function qrText() {
  if (qrMode === "vcard") return buildVCard(true);
  const base = PROFILE.siteUrl || (location.origin + location.pathname);
  const sep = base.includes("?") ? "&" : "?";
  return base + sep + "lang=" + encodeURIComponent(lang);
}
function makeQR(text) {
  if (typeof qrcode === "undefined") return null;
  try {
    if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"]; // 讓中文等文字正確編碼
    }
    const qr = qrcode(0, "M");
    qr.addData(text, "Byte");
    qr.make();
    return qr;
  } catch (e) {
    return null;
  }
}
// 把 QR code 畫到 canvas 上
function paintQR(canvas, qr, px) {
  const n = qr.getModuleCount();
  const quiet = 4;
  const total = n + quiet * 2;
  const scale = Math.max(1, Math.floor(px / total));
  const size = scale * total;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#0b2545";
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    }
  }
}
let currentQR = null;
function renderQR() {
  const t = I18N[lang];
  currentQR = makeQR(qrText());
  const box = $("qrBox");
  box.innerHTML = "";
  if (!currentQR) {
    box.appendChild(el("div", "qr-fallback", t.qrFail));
    $("dlQrBtn").disabled = true;
    return;
  }
  $("dlQrBtn").disabled = false;
  const canvas = document.createElement("canvas");
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", "QR code");
  paintQR(canvas, currentQR, 220 * Math.min(3, window.devicePixelRatio || 1));
  box.appendChild(canvas);
}
function qrDataUrl(px) {
  if (!currentQR) return "";
  const c = document.createElement("canvas");
  paintQR(c, currentQR, px);
  return c.toDataURL("image/png");
}
function downloadQR() {
  const url = qrDataUrl(1024);
  if (!url) return;
  const a = document.createElement("a");
  a.href = url;
  a.download = (PROFILE.name.en || "card").replace(/\s+/g, "_") + "_qr.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ---------- 列印用名片 ---------- */
function buildPrintSheet() {
  const t = I18N[lang];
  const sheet = $("printSheet");
  sheet.innerHTML = "";

  // 正面
  const front = el("div", "pcard pcard-front");
  front.appendChild(el("div", "bar"));
  front.appendChild(el("div", "p-name", primaryName()));
  const second = secondaryName();
  if (second) front.appendChild(el("div", "p-name2", second));
  const role = el("div", "p-role");
  const title = pick(PROFILE.title, lang);
  const org = [pick(PROFILE.org, lang), pick(PROFILE.dept, lang)].filter(Boolean).join(" · ");
  if (title) role.appendChild(el("div", null, title));
  if (org) role.appendChild(el("div", "org", org));
  front.appendChild(role);
  const contacts = el("div", "p-contacts");
  contactItems().forEach((item) => contacts.appendChild(el("div", null, item.value)));
  front.appendChild(contacts);
  sheet.appendChild(front);

  // 背面
  const back = el("div", "pcard pcard-back");
  const dataUrl = qrDataUrl(600);
  if (dataUrl) {
    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "QR code";
    back.appendChild(img);
  }
  back.appendChild(el("div", "p-scan", t.scanMe));
  back.appendChild(el("div", "p-name", primaryName()));
  sheet.appendChild(back);
}

/* ---------- 深淺色模式 ---------- */
function isDark() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function updateThemeButton() {
  const btn = $("themeBtn");
  btn.innerHTML = svgIcon(isDark() ? "sun" : "moon");
  btn.setAttribute("aria-label", I18N[lang].theme);
  btn.title = I18N[lang].theme;
}
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store("card-theme", next);
  updateThemeButton();
}

/* ---------- 畫面更新（切換語言時重新執行） ---------- */
function render() {
  const t = I18N[lang];
  const langInfo = LANGS.find((l) => l.code === lang);
  document.documentElement.lang = langInfo ? langInfo.html : lang;
  document.title = primaryName() + "｜" + t.cardTitle;

  // 固定的介面文字
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    const key = node.getAttribute("data-i18n");
    if (t[key]) node.textContent = t[key];
  });

  // 頭像
  const avatar = $("avatar");
  avatar.innerHTML = "";
  if (PROFILE.photo) {
    const img = document.createElement("img");
    img.src = PROFILE.photo;
    img.alt = primaryName();
    img.onerror = () => { avatar.textContent = initials(); };
    avatar.appendChild(img);
  } else {
    avatar.textContent = initials();
  }

  // 姓名與職稱
  $("namePrimary").textContent = primaryName();
  const second = secondaryName();
  $("nameSecondary").textContent = second;
  $("nameSecondary").hidden = !second;

  const roleLine = $("roleLine");
  roleLine.innerHTML = "";
  const title = pick(PROFILE.title, lang);
  const org = [pick(PROFILE.org, lang), pick(PROFILE.dept, lang)].filter(Boolean).join(" · ");
  if (title) roleLine.appendChild(el("span", null, title));
  if (org) roleLine.appendChild(el("span", "org", org));
  roleLine.hidden = !title && !org;

  // 關於我
  const bio = pick(PROFILE.bio, lang);
  $("bio").textContent = bio;
  $("aboutSec").hidden = !bio;

  // 聯絡方式
  const list = $("contactList");
  list.innerHTML = "";
  const items = contactItems();
  items.forEach((item) => {
    const li = el("li", "contact-item");
    const icon = el("span", "contact-icon");
    icon.innerHTML = svgIcon(item.key);
    li.appendChild(icon);

    const text = el("span", "contact-text");
    text.appendChild(el("span", "contact-label", t[item.key]));
    let value;
    if (item.href) {
      value = el("a", "contact-value", item.value);
      value.href = item.href;
      if (/^https?:/i.test(item.href)) { value.target = "_blank"; value.rel = "noopener"; }
    } else {
      value = el("span", "contact-value", item.value);
    }
    text.appendChild(value);
    li.appendChild(text);

    const copyBtn = el("button", "copy-btn");
    copyBtn.type = "button";
    copyBtn.innerHTML = svgIcon("copy");
    copyBtn.setAttribute("aria-label", t.copy + " " + t[item.key]);
    copyBtn.title = t.copy;
    copyBtn.addEventListener("click", () => copyText(item.copyValue || item.value));
    li.appendChild(copyBtn);

    list.appendChild(li);
  });
  $("contactSec").hidden = items.length === 0;

  // 專長
  const skills = pick(PROFILE.skills, lang) || [];
  const chips = $("skillList");
  chips.innerHTML = "";
  skills.forEach((s) => chips.appendChild(el("span", "chip", s)));
  $("skillsSec").hidden = skills.length === 0;

  // QR code 模式按鈕與說明
  document.querySelectorAll(".seg-btn").forEach((b) => {
    const active = b.getAttribute("data-mode") === qrMode;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", active ? "true" : "false");
  });
  $("qrHint").textContent = qrMode === "vcard" ? t.qrHintVcard : t.qrHintUrl;
  const warn = $("qrWarn");
  const localFile = location.protocol === "file:" && !PROFILE.siteUrl;
  warn.textContent = t.fileWarn;
  warn.hidden = !(qrMode === "url" && localFile);

  renderQR();
  updateThemeButton();
}

/* ---------- 初始化 ---------- */
function init() {
  const savedTheme = store("card-theme");
  if (savedTheme === "light" || savedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", savedTheme);
  }

  const select = $("langSelect");
  LANGS.forEach((l) => {
    const opt = document.createElement("option");
    opt.value = l.code;
    opt.textContent = l.label;
    select.appendChild(opt);
  });
  select.value = lang;
  select.addEventListener("change", () => {
    lang = select.value;
    store("card-lang", lang);
    render();
  });

  document.querySelectorAll(".seg-btn").forEach((b) => {
    b.addEventListener("click", () => {
      qrMode = b.getAttribute("data-mode");
      store("card-qr-mode", qrMode);
      render();
    });
  });

  $("themeBtn").addEventListener("click", toggleTheme);
  $("vcfBtn").addEventListener("click", downloadVCard);
  $("dlQrBtn").addEventListener("click", downloadQR);
  $("printBtn").addEventListener("click", () => { buildPrintSheet(); window.print(); });
  window.addEventListener("beforeprint", buildPrintSheet);

  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", updateThemeButton);
  }

  render();
}

init();
</script>
</body>
</html>
